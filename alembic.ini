# Alembic configuration.
#
# `create_all` is a test convenience. A deployment migrates, because a schema
# that was never migrated cannot be upgraded without guessing what state it is
# already in.
#
# There is no `sqlalchemy.url` here on purpose. The URL comes from
# SENTINELID_DB_URL, so a migration cannot be run against the wrong database by
# whoever last edited this file. See db/migrations/env.py.

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
