# import-linter configuration.
#
# Rule 5 of CLAUDE.md, enforced mechanically rather than by review: the decision
# logic must never be able to reach the outside world. A detector that needs
# data is handed it as an argument.
#
# Run with `lint-imports`, or as part of `make check`.

[importlinter]
root_packages =
    core
    detectors
    extraction
    ledger
    api
    db
    explain
    ui
    datagen
    eval
include_external_packages = True

[importlinter:contract:core-and-detectors-are-sealed]
name = core and detectors never import api, db or ui
type = forbidden
source_modules =
    core
    detectors
forbidden_modules =
    api
    db
    ui

[importlinter:contract:core-does-not-know-about-detectors]
name = core never imports detectors
type = forbidden
source_modules =
    core
forbidden_modules =
    detectors

[importlinter:contract:core-is-pure]
name = core imports no framework, no I/O library and no model runtime
type = forbidden
source_modules =
    core
forbidden_modules =
    fastapi
    uvicorn
    sqlalchemy
    alembic
    onnxruntime
    torch
    cv2
    numpy
    PIL
    requests
    httpx
