[project]
name = "sentinelid"
version = "0.0.0"
description = "AI-based fake identity and document screening for SSB border checkpoints."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Pydantic is a runtime dependency, not a development one: the evidence
# contract in core/contracts is built from Pydantic v2 models, so the package
# cannot be imported without it. Nothing else is a runtime dependency yet.
dependencies = [
    "alembic>=1.19.2",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.9,<3",
    "pyhanko>=0.37.0",
    "python-multipart>=0.0.32",
    "pyzbar>=0.1.9",
    "rapidocr-onnxruntime>=1.4.4",
    "scikit-image>=0.26.0",
    "signxml>=5.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.11",
    "import-linter>=2.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "detectors",
    "extraction",
    "ledger",
    "api",
    "db",
    "explain",
    "ui",
    "datagen",
    "eval",
]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",    # shadowed builtins
    "ANN",  # missing annotations
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PTH",  # use pathlib
    "RUF",
    "S",    # bandit
    "SIM",
    "TID",  # tidy imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # Detector.id is named by the contract in CLAUDE.md. Shadowing the builtin
    # on a class attribute is deliberate and harmless.
    "A003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# FastAPI declares dependencies, uploads and form fields as argument defaults.
# That is the framework's documented idiom, not the mutable-default bug B008
# exists to catch, so these calls are declared immutable rather than silenced
# with a file-wide ignore that would also hide a real one.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the point.
"tests/**" = ["S101"]
# Specimen generation is seeded for reproducibility, not for secrecy. A
# cryptographic generator here would defeat the purpose: a fixture has to be
# regenerable byte for byte from its seed.
"datagen/**" = ["S311"]

# ----------------------------------------------------------------------------
# mypy. `make types` runs this in strict mode over core/ only, per CLAUDE.md.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# ----------------------------------------------------------------------------
# pytest and coverage
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=core",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.run]
# CLAUDE.md requires 100% branch coverage of core/. It is pure functions.
source = ["core"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    # Phase-0 stubs. The line is unreachable by design until the module is
    # implemented; the def above it is still required to be imported.
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
